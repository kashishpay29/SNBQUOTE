<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNB Engg. — Quotation Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C0392B;--red2:#E74C3C;--dark:#1F2937;
  --gray:#6B7280;--lgray:#E5E7EB;--offwhite:#F9FAFB;--white:#fff;
  --body:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif;
}
body{font-family:var(--body);background:var(--offwhite);color:var(--dark);min-height:100vh}
.app{display:grid;grid-template-columns:420px 1fr;min-height:100vh}
.form-panel{background:var(--white);border-right:1px solid var(--lgray);overflow-y:auto;height:100vh;position:sticky;top:0}
.preview-panel{padding:24px;background:#E8EAED;overflow-y:auto;min-height:100vh}
.panel-header{background:var(--red);padding:18px 24px;position:sticky;top:0;z-index:10}
.panel-header h1{font-family:var(--display);font-size:20px;font-weight:800;color:var(--white);letter-spacing:0.04em}
.panel-header p{font-size:11px;color:rgba(255,255,255,0.75);margin-top:2px}
.form-body{padding:18px 24px}
.form-section{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--lgray)}
.form-section:last-child{border-bottom:none}
.section-title{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.section-title::before{content:'';width:14px;height:2px;background:var(--red)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.field-row.single{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:0.06em}
.field input,.field textarea{padding:7px 9px;border:1px solid var(--lgray);border-radius:4px;font-family:var(--body);font-size:13px;color:var(--dark);background:var(--white);outline:none;transition:border-color 0.15s}
.field input:focus,.field textarea:focus{border-color:var(--red)}
.field textarea{resize:vertical;min-height:52px}
/* items form — card layout so the product-name field always has room to type */
.item-card{border:1px solid var(--lgray);border-radius:6px;margin-bottom:8px;overflow:hidden}
.item-card-top{display:flex;gap:8px;align-items:flex-start;padding:8px;background:var(--offwhite);border-bottom:1px solid var(--lgray)}
.item-num{flex-shrink:0;width:16px;padding-top:8px;font-size:11px;font-weight:700;color:var(--red);text-align:center}
.item-card-top .mini-field{flex:1;min-width:0}
.item-card-top textarea{min-height:50px}
.item-del{flex-shrink:0;background:none;border:none;color:var(--gray);cursor:pointer;font-size:18px;line-height:1;padding:4px;margin-top:2px;transition:color 0.15s}
.item-del:hover{color:var(--red)}
.item-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;padding:8px}
.mini-field{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini-field label{font-size:8.5px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-field input,.mini-field textarea{padding:6px 7px;border:1px solid var(--lgray);border-radius:3px;font-family:var(--body);font-size:12px;color:var(--dark);width:100%;outline:none;background:var(--offwhite);text-align:right}
.mini-field input:focus,.mini-field textarea:focus{border-color:var(--red);background:var(--white)}
.mini-field textarea{text-align:left;resize:vertical;min-height:50px}
.mini-field.readout .item-calc{padding:6px 7px;font-size:12px;font-weight:700;color:var(--dark);text-align:right;white-space:nowrap;overflow:hidden;background:var(--lgray);border-radius:3px;min-height:16px}
.mini-field.total .item-calc{color:var(--red);background:#FBEAE8}
.add-item-btn{width:100%;padding:9px;background:var(--offwhite);border:1px dashed var(--lgray);border-radius:6px;font-family:var(--body);font-size:11px;font-weight:600;color:var(--gray);cursor:pointer;transition:all 0.15s}
.add-item-btn:hover{background:var(--lgray);color:var(--dark)}
.actions{padding:14px 24px;background:var(--offwhite);border-top:1px solid var(--lgray);position:sticky;bottom:0;display:flex;gap:8px}
.btn-primary{flex:1;padding:10px;background:var(--red);color:var(--white);border:none;border-radius:4px;font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:0.06em;cursor:pointer;text-transform:uppercase;transition:background 0.15s}
.btn-primary:hover{background:var(--red2)}
.btn-sec{padding:10px 14px;background:var(--white);color:var(--dark);border:1px solid var(--lgray);border-radius:4px;font-family:var(--body);font-size:12px;font-weight:600;cursor:pointer}
.btn-sec:hover{border-color:var(--dark)}
/* preview */
.preview-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.preview-toolbar h2{font-size:13px;font-weight:600;color:var(--gray)}
.pdf-page{background:var(--white);width:794px;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,0.15);font-family:var(--body);padding:12px 12px 24px;border:1.5px solid var(--dark)}

/* ══ QUOTATION PDF STYLES ══ */
.q-header{border:1.5px solid var(--dark);margin:8px 8px 0;border-bottom:none}
.q-top{display:grid;grid-template-columns:116px 1fr auto;border-bottom:1.5px solid var(--dark)}
.q-logo-box{border-right:1px solid var(--dark);display:flex;align-items:center;justify-content:center;background:#C0392B;min-width:116px}
.q-company{padding:8px 12px;text-align:center}
.q-company h1{font-family:var(--display);font-size:28px;font-weight:800;color:var(--red);letter-spacing:0.06em;line-height:1}
.q-company p{font-size:9.5px;color:var(--dark);line-height:1.6;margin-top:4px}
.q-copies{border:1px solid var(--dark);padding:8px 12px;min-width:220px;display:flex;align-items:center;justify-content:center;text-align:center}
.q-copy-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:9.5px;color:var(--dark)}
.q-copy-dot{width:11px;height:11px;border:1.5px solid var(--dark);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:7px;color:var(--red);flex-shrink:0}
.q-title-row{border-bottom:1.5px solid var(--dark);display:flex;justify-content:space-between;align-items:center;padding:5px 12px}
.q-title-row h2{font-family:var(--display);font-size:20px;font-weight:800;color:var(--dark);letter-spacing:0.08em}
.q-meta p{font-size:10.5px;color:var(--dark);line-height:1.8;text-align:right}
.q-addresses{display:grid;grid-template-columns:1fr 1fr;margin:0 8px;border:1.5px solid var(--dark);border-top:none}
.q-addr-box{padding:8px 12px;border-right:1px solid var(--dark)}
.q-addr-box:last-child{border-right:none}
.q-addr-label{font-size:9.5px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;border-bottom:1px solid var(--lgray);padding-bottom:3px}
.q-addr-box strong{font-size:12px;font-weight:700;color:var(--dark);display:block}
.q-addr-box p{font-size:10.5px;color:var(--dark);line-height:1.6}
/* items table */
.q-items{margin:0 8px}
.q-tbl{width:100%;border-collapse:collapse;border:1.5px solid var(--dark);font-size:9.5px;table-layout:fixed}
.q-tbl th{padding:5px 4px;background:var(--dark);color:var(--white);font-size:8.5px;font-weight:700;text-align:center;border:1px solid #374151;white-space:nowrap;overflow:hidden}
.q-tbl td{padding:4px 4px;border:1px solid var(--lgray);color:var(--dark);vertical-align:top}
.q-tbl td.c{text-align:center}
.q-tbl td.r{text-align:right}
.q-tbl td.b{font-weight:700}
.q-tbl td.desc{font-size:9.5px;line-height:1.4}
.q-tbl tr.grand td{background:var(--offwhite);font-weight:700;border-top:1.5px solid var(--dark)}
/* bottom grid */
.q-bottom{display:grid;grid-template-columns:1fr 1fr;margin:0 8px;border:1.5px solid var(--dark);border-top:none}
.q-bottom-left{border-right:1px solid var(--dark);padding:8px 10px}
.q-bottom-right{padding:8px 10px}
.q-section-head{font-size:9.5px;font-weight:700;color:var(--dark);border-bottom:1px solid var(--lgray);padding-bottom:3px;margin-bottom:5px}
.q-bank p{font-size:9.5px;color:var(--dark);line-height:1.75}
.q-tax-row{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dark);padding:2px 0;border-bottom:1px solid var(--lgray)}
.q-tax-row.grand{font-weight:700;font-size:12px;border-bottom:none;padding-top:5px}
.q-tax-row.grand span:last-child{color:var(--red)}
/* notes terms footer */
.q-nt{display:grid;grid-template-columns:1fr 1fr;margin:0 8px;border:1.5px solid var(--dark);border-top:none}
.q-notes{border-right:1px solid var(--dark);padding:8px 10px}
.q-terms{padding:8px 10px}
.q-nt-head{font-size:9.5px;font-weight:700;color:var(--red);margin-bottom:5px}
.q-notes ul{padding-left:12px}
.q-notes ul li{font-size:9.5px;color:var(--dark);line-height:1.6}
.q-terms table{width:100%;border-collapse:collapse}
.q-terms table td{padding:3px 6px;font-size:9.5px;border-bottom:1px solid var(--lgray)}
.q-terms table tr:last-child td{border-bottom:none}
.q-terms table td:first-child{font-weight:600;color:var(--dark);width:100px;background:var(--offwhite)}
.q-terms table td:last-child{color:var(--gray)}
.q-footer{display:grid;grid-template-columns:1fr 1fr;margin:0 8px;border:1.5px solid var(--dark);border-top:none}
.q-footer-left{border-right:1px solid var(--dark);padding:8px 10px;font-size:9.5px;color:var(--gray);line-height:1.5}
.q-footer-right{padding:8px 10px;text-align:right}
.q-footer-right p{font-size:11px;font-weight:700;color:var(--dark)}
.q-sig{margin-top:55px;border-top:1px solid var(--dark);padding-top:4px;font-size:9.5px;color:var(--gray)}
.q-eoae{margin:4px 8px;font-size:9.5px;color:var(--gray);font-style:italic}

@media(max-width:1300px){
  .app{grid-template-columns:360px 1fr}
  .pdf-page{transform:scale(0.9);transform-origin:top center}
}
@media print{
  @page{size:A4 portrait;margin:15mm}
  html,body{width:auto;height:auto;background:white;overflow:visible}
  .form-panel,.preview-toolbar,.actions{display:none !important}
  .app{display:block !important}
  .preview-panel{padding:0;background:white;overflow:visible;min-height:unset}
  .pdf-page{
    box-shadow:none;
    width:100%;
    min-height:auto;
    margin:0;
    padding:0;
    border:none;
    transform:none !important;
    page-break-after:auto;
    overflow:visible;
  }
  /* prevent any section from being clipped */
  .q-header,.q-addresses,.q-bottom,.q-nt,.q-footer,.q-eoae{
    page-break-inside:avoid;
    overflow:visible;
  }
  /* items table can be long; let it flow across pages instead of being clipped */
  .q-items{
    overflow:visible;
  }
  .q-tbl{
    page-break-inside:auto;
  }
  .q-tbl thead{
    display:table-header-group;
  }
  .q-tbl tr{
    page-break-inside:avoid;
    page-break-after:auto;
  }
}
</style>
</head>
<body>
<div class="app">

<!-- ══ FORM PANEL ══ -->
<div class="form-panel">
  <div class="panel-header">
    <h1>SNB ENGG. Quotation</h1>
    <p>Fill in details — preview updates live</p>
  </div>
  <div class="form-body">

    <div class="form-section">
      <div class="section-title">Quote Details</div>
      <div class="field-row">
        <div class="field"><label>Quote No.</label><input id="quoteNo" value="SNB/Q/2026-06/014" oninput="render()"></div>
        <div class="field"><label>Date</label><input id="quoteDate" type="date" oninput="render()"></div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Bill To (Customer)</div>
      <div class="field-row single"><div class="field"><label>Company Name</label><input id="billName" placeholder="M/s. Customer Name" oninput="render()"></div></div>
      <div class="field-row single"><div class="field"><label>Address Line 1</label><input id="billAddr1" oninput="render()"></div></div>
      <div class="field-row">
        <div class="field"><label>City, State</label><input id="billCity" oninput="render()"></div>
        <div class="field"><label>PIN</label><input id="billPin" oninput="render()"></div>
      </div>
      <div class="field-row single"><div class="field"><label>GSTIN</label><input id="billGst" oninput="render()"></div></div>
    </div>

    <div class="form-section">
      <div class="section-title">Ship To (Site)</div>
      <div class="field-row single"><div class="field"><label>Site / Project Name</label><input id="shipName" oninput="render()"></div></div>
      <div class="field-row single"><div class="field"><label>Site Address</label><input id="shipAddr1" oninput="render()"></div></div>
      <div class="field-row">
        <div class="field"><label>City, State</label><input id="shipCity" oninput="render()"></div>
        <div class="field"><label>PIN</label><input id="shipPin" oninput="render()"></div>
      </div>
      <div class="field-row single"><div class="field"><label>Contact</label><input id="shipContact" oninput="render()"></div></div>
    </div>

    <div class="form-section">
      <div class="section-title">Line Items</div>
      <div id="itemsContainer"></div>
      <button class="add-item-btn" onclick="addItem()">+ Add Line Item</button>
    </div>

    <div class="form-section">
      <div class="section-title">Notes & Scope</div>
      <div class="field-row single"><div class="field"><label>Notes (one per line)</label>
        <textarea id="notes" rows="4" oninput="render()"></textarea>
      </div></div>
    </div>

    <div class="form-section">
      <div class="section-title">Terms & Conditions</div>
      <div class="field-row">
        <div class="field"><label>Packing & Forwarding</label><input id="tPacking" value="Inclusive" oninput="render()"></div>
        <div class="field"><label>Freight</label><input id="tFreight" value="Extra at actuals" oninput="render()"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Delivery</label><input id="tDelivery" value="Within 2-3 weeks from PO + advance" oninput="render()"></div>
        <div class="field"><label>Payment</label><input id="tPayment" value="100% advance along with order" oninput="render()"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Validity</label><input id="tValidity" value="30 days from date of quote" oninput="render()"></div>
        <div class="field"><label>Warranty</label><input id="tWarranty" value="12 months from date of supply" oninput="render()"></div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Footer Message</div>
      <div class="field-row single"><div class="field">
        <textarea id="footerMsg" rows="2" oninput="render()">We assure you our prompt attention to all your requirements.</textarea>
      </div></div>
    </div>

  </div>
  <div class="actions">
    <button class="btn-sec" onclick="resetForm()">Reset</button>
    <button class="btn-primary" onclick="window.print()">⬇ Download PDF</button>
  </div>
</div>

<!-- ══ PREVIEW PANEL ══ -->
<div class="preview-panel">
  <div class="preview-toolbar">
    <h2>Live Preview — Quotation</h2>
    <span style="font-size:12px;color:var(--gray)">A4 Portrait</span>
  </div>
  <div id="pdfPreview" class="pdf-page"></div>
</div>
</div>

<script>
const GSTIN = "27HEKPS1128L1ZY";
const SNB_PHONE = "9004422126";
const SNB_ADDR = ["Office No: C-002, Shree Samriddhi Bldg","Behind Happy Home Heights, Poonam Garden","S.K. Stone, Mira Road (East), Thane — 401107"];

const SVG_LOGO = `<svg width="108" height="108" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <rect width="108" height="108" fill="#C0392B"/>
  <rect x="30" y="34" width="32" height="44" rx="2" fill="none" stroke="#1a1a1a" stroke-width="2.8"/>
  <rect x="36" y="40" width="20" height="12" rx="1.5" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <line x1="26" y1="78" x2="66" y2="78" stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M62 44 Q72 44 72 52 L72 58" fill="none" stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M68 58 L76 58 L76 65 L68 65 Z" fill="none" stroke="#1a1a1a" stroke-width="2.4"/>
  <text x="54" y="96" font-family="Georgia,serif" font-size="8.5" font-weight="bold" letter-spacing="3.5" fill="#ffffff" text-anchor="middle">SNB ENGG</text>
</svg>`;

const GST_RATE = 18;
let items = [{desc:'',qty:'1',rate:''}];

window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('quoteDate').value=new Date().toISOString().split('T')[0];
  renderItemRows();render();
});

function addItem(){
  items.push({desc:'',qty:'1',rate:''});
  renderItemRows();render();
}
function removeItem(i){if(items.length===1)return;items.splice(i,1);renderItemRows();render();}

function renderItemRows(){
  document.getElementById('itemsContainer').innerHTML=items.map((item,i)=>`
    <div class="item-card">
      <div class="item-card-top">
        <div class="item-num">${i+1}</div>
        <div class="mini-field">
          <label>Name of the Product</label>
          <textarea oninput="ui(${i},'desc',this.value)">${item.desc}</textarea>
        </div>
        <button class="item-del" onclick="removeItem(${i})" title="Remove item">×</button>
      </div>
      <div class="item-card-grid">
        <div class="mini-field"><label>Qty</label><input type="number" value="${item.qty}" oninput="ui(${i},'qty',this.value)"></div>
        <div class="mini-field"><label>Rate (₹)</label><input type="number" value="${item.rate}" placeholder="0.00" oninput="ui(${i},'rate',this.value)"></div>
        <div class="mini-field readout"><label>Amt (₹)</label><div class="item-calc" id="iamt-${i}">${fmtC(base(item))}</div></div>
        <div class="mini-field readout"><label>GST (18%)</label><div class="item-calc" id="igst-${i}">${fmtC(gst(item))}</div></div>
        <div class="mini-field readout total"><label>Total (₹)</label><div class="item-calc" id="itot-${i}">${fmtC(total(item))}</div></div>
      </div>
    </div>`).join('');
}

function ui(i,f,v){
  items[i][f]=v;
  const b=base(items[i]);
  const gs=gst(items[i]);
  const el=id=>document.getElementById(id);
  if(el('iamt-'+i)) el('iamt-'+i).textContent=fmtC(b);
  if(el('igst-'+i)) el('igst-'+i).textContent=fmtC(gs);
  if(el('itot-'+i)) el('itot-'+i).textContent=fmtC(b+gs);
  render();
}

function base(item){return (parseFloat(item.qty)||0)*(parseFloat(item.rate)||0);}
function gst(item){return base(item)*GST_RATE/100;}
function total(item){return base(item)+gst(item);}
function fmtC(n){return n?n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}):'';}
function fmt(n,dec=2){return n.toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function fmtDate(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}-${m}-${y}`;}
function g(id){return document.getElementById(id)?.value||'';}

function calcTotals(){
  let sub=0,gstTotal=0;
  items.forEach(item=>{
    sub+=base(item);
    gstTotal+=gst(item);
  });
  return{sub,gst:gstTotal,grand:sub+gstTotal};
}

function numToWords(n){
  const a=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];
  const b=['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
  function t(n){
    if(n<20)return a[n];if(n<100)return b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'');
    if(n<1000)return a[Math.floor(n/100)]+' HUNDRED'+(n%100?' '+t(n%100):'');
    if(n<100000)return t(Math.floor(n/1000))+' THOUSAND'+(n%1000?' '+t(n%1000):'');
    if(n<10000000)return t(Math.floor(n/100000))+' LAKH'+(n%100000?' '+t(n%100000):'');
    return t(Math.floor(n/10000000))+' CRORE'+(n%10000000?' '+t(n%10000000):'');
  }
  const int=Math.floor(n),dec=Math.round((n-int)*100);
  return(t(int)||'ZERO')+(dec?' AND '+t(dec)+' PAISE':'')+' RUPEES ONLY';
}

function render(){
  const T=calcTotals();
  const notes=g('notes').split('\n').filter(l=>l.trim());

  document.getElementById('pdfPreview').innerHTML=`
    <div class="q-header">
      <!-- TOP -->
      <div class="q-top">
        <div class="q-logo-box">${SVG_LOGO}</div>
        <div class="q-company">
          <h1>SNB ENGG.</h1>
          <p>${SNB_ADDR.join('<br>')}</p>
          <p style="margin-top:3px"><strong>Mob: ${SNB_PHONE}</strong> &nbsp;|&nbsp; <strong>GSTN: ${GSTIN}</strong></p>
        </div>
        <div class="q-copies"></div>
      </div>
      <!-- TITLE -->
      <div class="q-title-row">
        <h2>QUOTATION</h2>
        <div class="q-meta">
          <p><strong>Quote No.:</strong> ${g('quoteNo')||'—'}</p>
          <p><strong>Date:</strong> ${fmtDate(g('quoteDate'))}</p>
        </div>
      </div>
    </div>

    <!-- ADDRESSES -->
    <div class="q-addresses">
      <div class="q-addr-box">
        <div class="q-addr-label">Bill To</div>
        <strong>${g('billName')||'M/s. Customer Name'}</strong>
        <p>${[g('billAddr1'),g('billCity')+(g('billPin')?' — '+g('billPin'):'')].filter(Boolean).join('<br>')}</p>
        ${g('billGst')?`<p style="margin-top:3px;font-weight:700;font-size:9px">GSTIN: ${g('billGst')}</p>`:''}
      </div>
      <div class="q-addr-box">
        <div class="q-addr-label">Ship To / Site</div>
        <strong>${g('shipName')||'Site / Project Name'}</strong>
        <p>${[g('shipAddr1'),g('shipCity')+(g('shipPin')?' — '+g('shipPin'):'')].filter(Boolean).join('<br>')}</p>
        ${g('shipContact')?`<p style="margin-top:3px;font-size:9px">Contact: ${g('shipContact')}</p>`:''}
      </div>
    </div>

    <!-- ITEMS TABLE -->
    <div class="q-items">
      <table class="q-tbl">
        <colgroup>
          <col style="width:30px"><col>
          <col style="width:50px"><col style="width:74px">
          <col style="width:84px"><col style="width:84px">
          <col style="width:88px">
        </colgroup>
        <thead>
          <tr>
            <th>#</th>
            <th style="text-align:left">Name of the Product</th>
            <th>Qty</th>
            <th>Rate (₹)</th>
            <th>Amt (₹)</th>
            <th>GST (18%)</th>
            <th>Total (₹)</th>
          </tr>
        </thead>
        <tbody>
          ${items.map((item,i)=>{
            const b=base(item),r=parseFloat(item.rate)||0,gs=gst(item),tot=total(item);
            return`<tr>
              <td class="c b">${i+1}</td>
              <td class="desc">${(item.desc||'—').replace(/\n/g,'<br>')}</td>
              <td class="c">${item.qty||''}</td>
              <td class="r">${r?fmt(r):'—'}</td>
              <td class="r">${b?fmt(b):'—'}</td>
              <td class="r">${gs?fmt(gs):'—'}</td>
              <td class="r b">${tot?fmt(tot):'—'}</td>
            </tr>`;
          }).join('')}
          <tr class="grand">
            <td colspan="4" class="b">Grand Total</td>
            <td class="r b">${T.sub?fmt(T.sub):''}</td>
            <td class="r b">${T.gst?fmt(T.gst):''}</td>
            <td class="r b" style="color:var(--red);font-size:9.5px">${T.grand?fmt(T.grand):''}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- BOTTOM: Amount in words + Bank | Tax summary -->
    <div class="q-bottom">
      <div class="q-bottom-left">
        <div style="font-size:8px;color:var(--gray);margin-bottom:3px">Total Amount in Words</div>
        <div style="font-size:9px;color:var(--red);font-weight:700;margin-bottom:8px;border-bottom:1px solid var(--lgray);padding-bottom:5px">${T.grand?numToWords(Math.round(T.grand)):''}</div>
        <div class="q-section-head">: Bank Details :</div>
        <div class="q-bank">
          <p>Bank Name: <strong>HDFC BANK</strong></p>
          <p>Name: <strong>SNB ENGG.</strong></p>
          <p>A/C No.: <strong>50200061262588</strong></p>
          <p>IFSC Code: <strong>HDFC0001077</strong></p>
          <p>Account Type: <strong>Current Account</strong></p>
          <p>Branch: BEVERLY PARK, Mira Road East, Thane</p>
        </div>
      </div>
      <div class="q-bottom-right">
        <div class="q-tax-row"><span>Total Amount Before Tax</span><span>₹ ${fmt(T.sub)}</span></div>
        <div class="q-tax-row"><span>Add: GST (18%)</span><span>₹ ${fmt(T.gst)}</span></div>
        <div class="q-tax-row grand"><span><strong>Total Amount After Tax</strong></span><span><strong>₹ ${fmt(T.grand)}</strong></span></div>
      </div>
    </div>

    <!-- NOTES & TERMS -->
    <div class="q-nt">
      <div class="q-notes">
        <div class="q-nt-head">Notes & Scope</div>
        <ul>${notes.length?notes.map(n=>`<li>${n}</li>`).join(''):'<li style="color:#9CA3AF;font-style:italic">No notes added</li>'}</ul>
      </div>
      <div class="q-terms">
        <div class="q-nt-head">Terms & Conditions</div>
        <table>
          <tr><td>Price</td><td>As per above offer</td></tr>
          <tr><td>Sales Tax</td><td>GST extra as applicable</td></tr>
          <tr><td>Packing & Forwarding</td><td>${g('tPacking')}</td></tr>
          <tr><td>Freight</td><td>${g('tFreight')}</td></tr>
          <tr><td>Delivery</td><td>${g('tDelivery')}</td></tr>
          <tr><td>Payment</td><td>${g('tPayment')}</td></tr>
          <tr><td>Validity</td><td>${g('tValidity')}</td></tr>
          <tr><td>Warranty</td><td>${g('tWarranty')}</td></tr>
        </table>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="q-footer">
      <div class="q-footer-left">
        <p style="margin-bottom:4px">Certified that the particulars given above are true and correct.</p>
        <p>${g('footerMsg')||'We assure you our prompt attention to all your requirements.'}</p>
      </div>
      <div class="q-footer-right">
        <p>For SNB Engg.</p>
        <div class="q-sig">Authorised Signatory</div>
      </div>
    </div>
    <div class="q-eoae">[ E&amp;OE ]</div>
  `;
}

function resetForm(){
  if(!confirm('Reset all fields?'))return;
  document.querySelectorAll('input:not([type=radio]):not([type=checkbox]),textarea').forEach(el=>{
    const d={quoteNo:'SNB/Q/2026-06/001',tPacking:'Inclusive',tFreight:'Extra at actuals',
      tDelivery:'Within 2-3 weeks from PO + advance',tPayment:'100% advance along with order',
      tValidity:'30 days from date of quote',tWarranty:'12 months from date of supply',
      footerMsg:'We assure you our prompt attention to all your requirements.'};
    el.value=d[el.id]||'';
  });
  document.getElementById('quoteDate').value=new Date().toISOString().split('T')[0];
  items=[{desc:'',qty:'1',rate:''}];
  renderItemRows();render();
}
</script>
</body>
</html>
